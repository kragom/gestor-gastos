name: keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'      # cada 5 min (mínimo permitido por GitHub)
  workflow_dispatch:            # permite lanzarlo a mano para probar
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping repetido a /healthz
        run: |
          URL="https://gestor-gastos-7u4b.onrender.com/healthz"
          # Varios pings durante ~13 min para cubrir huecos si GitHub
          # se salta alguna ejecución programada (Render duerme a los ~15 min).
          for i in $(seq 1 7); do
            if curl -fsS --retry 2 --max-time 90 "$URL"; then
              echo " -> ping $i OK ($(date -u +%H:%M:%S) UTC)"
            else
              echo " -> ping $i fallido, la app puede estar arrancando ($(date -u +%H:%M:%S) UTC)"
            fi
            if [ "$i" -lt 7 ]; then sleep 120; fi
          done
