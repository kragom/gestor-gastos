name: keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'      # cada 5 min
  workflow_dispatch:            # permite lanzarlo a mano para probar
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          curl -fsS --max-time 90 https://gestor-gastos-7u4b.onrender.com/healthz \
            && echo "OK: app despierta" \
            || echo "Ping fallido (la app puede estar arrancando)"
