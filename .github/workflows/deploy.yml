name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Lanzando deploy en Render para $RENDER_SERVICE_ID"
          resp=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -ge 300 ]; then
            echo "Deploy request fallo"; exit 1
          fi
          deploy_id=$(echo "$body" | grep -o '"id":"[^"]*"' | head -n1 | cut -d'"' -f4)
          echo "Deploy iniciado: $deploy_id"

          # Esperar a que termine
          for i in $(seq 1 60); do
            sleep 15
            st=$(curl -sS "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | grep -o '"status":"[^"]*"' | head -n1 | cut -d'"' -f4)
            echo "estado: $st"
            case "$st" in
              live) echo "Deploy correcto"; exit 0 ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "Deploy fallo: $st"; exit 1 ;;
            esac
          done
          echo "Timeout esperando el deploy"; exit 1
